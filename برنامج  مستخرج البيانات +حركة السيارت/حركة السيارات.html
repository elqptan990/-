<title>حركة السيارات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: slim toolbar on top (upload, date, row actions, print/export), then the paper form large and centered, exactly as it prints. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --fg:#14202a; --muted:#5a6b7a; --line:#d4dce3; --backdrop:#e3e9ee;
  --accent:#0f6f80; --accent-fg:#ffffff; --accent-soft:#e0f0f3;
  --ok:#17794a; --danger:#b3261e; --shadow:0 1px 2px rgba(20,32,42,.06),0 8px 24px rgba(20,32,42,.08);
  --ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --doc:'Times New Roman',Times,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141a; --surface:#16202a; --fg:#e8eef3; --muted:#9aa9b6; --line:#2a3945; --backdrop:#111a22;
  --accent:#4cb6c6; --accent-fg:#052229; --accent-soft:#12303a; --ok:#52c28a; --danger:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a; --surface:#16202a; --fg:#e8eef3; --muted:#9aa9b6; --line:#2a3945; --backdrop:#111a22;
  --accent:#4cb6c6; --accent-fg:#052229; --accent-soft:#12303a; --ok:#52c28a; --danger:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;
  padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools .end{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap}
.sep{width:1px;height:26px;background:var(--line)}
@media (max-width:640px){.sep{display:none}}

button{font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);padding:0 14px;min-height:40px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button svg{width:18px;height:18px;flex:none}
.icon{padding:0;width:40px}

.date{display:flex;align-items:center;gap:6px;position:relative}
.dlabel{min-width:210px;justify-content:center;font-weight:500;background:var(--bg)}
.dhidden{position:absolute;inset:0;opacity:0;pointer-events:none;width:100%;height:100%}
.dhidden.show{opacity:1;pointer-events:auto;position:static;width:auto;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;padding:0 8px}
.chip{font-size:13.5px;min-height:40px;padding:0 12px}

.status{margin:0;font-size:14px;color:var(--muted);min-height:21px}
.status.ok{color:var(--ok)} .status.err{color:var(--danger)}

/* the form: always a white sheet with black ink, whatever the theme */
.sheetwrap{overflow-x:auto;background:var(--backdrop);border-radius:14px;padding:22px 14px}
.sheet{background:#fff;color:#000;font-family:var(--doc);font-size:14pt;font-weight:400;min-width:780px;max-width:920px;margin-inline:auto;
  padding:26px 30px 30px;box-shadow:0 2px 4px rgba(0,0,0,.12),0 14px 34px rgba(0,0,0,.18);border-radius:2px}
.head{display:grid;grid-template-columns:84px 1fr 84px;align-items:center;gap:8px}
.head img{width:80px;height:80px;display:block}
.head .t{text-align:center;line-height:1.45;font-weight:700}
.dateline{direction:rtl;text-align:right;margin:16px 0 14px;font-weight:700}
table{border-collapse:collapse;width:100%;direction:ltr;table-layout:fixed;font:inherit;color:#000}
th,td{border:1px solid #000;padding:0;height:34px;text-align:center}
th{font-weight:700;font-size:14pt}
td.n{font-weight:700}
td input{display:block;width:100%;height:100%;min-height:32px;border:0;background:transparent;color:#000;font:inherit;text-align:center;padding:2px 4px;min-width:0;border-radius:0}
td:hover{background:#f1f8fa}
td input:focus{outline:2px solid #0f6f80;outline-offset:-2px;background:#e4f3f6}
th:first-child{width:56px} th:nth-child(2){width:15%} th:nth-child(3){width:15%} th:nth-child(4){width:30%} th:nth-child(5){width:22%} th:nth-child(6){width:12%}
th.x,td.x{border:0;width:36px;background:transparent}
th.tm,td.tm{border:0;width:92px;background:transparent;color:#5a6b7a;font-size:11.5pt;font-variant-numeric:tabular-nums}
th.tm{font-size:10pt;font-weight:600}
td.tm{font-weight:600}
td.x button{border:0;background:transparent;color:#b3261e;min-height:0;width:28px;height:28px;padding:0;font-size:18px;line-height:1;border-radius:6px}
td.x button:hover{background:#fde8e6}

.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;
  font-size:22px;font-weight:600;color:var(--accent);z-index:30;backdrop-filter:blur(2px)}
.overlay.on{display:flex}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* toolbar: header, upload zone, summary, actions */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.top h1{font-size:24px}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.drop{flex-direction:column;gap:4px;min-height:92px;width:100%;border:2px dashed var(--line);background:var(--bg);border-radius:12px;padding:14px}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
.drop .hint{font-size:13px;color:var(--muted);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:8px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat strong{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.rule{margin:0;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions .end{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:480px){.dlabel{min-width:140px}.stat strong{font-size:17px}}

#sheets{display:flex;flex-direction:column;align-items:center;gap:22px}
.sheet{width:100%;display:flex;flex-direction:column;aspect-ratio:210/297}
.sheet table{flex:1 1 auto}
.sheet td input{font-weight:700}
.pagetag{font-family:var(--ui);font-size:12.5px;color:#5a6b7a;text-align:right;margin-bottom:10px}
/* printing: the paper only */
@page{size:A4 portrait;margin:8mm}
@media print{
  html,body{background:#fff!important;padding:0!important}
  .wrap>*:not(.sheetwrap),.toast,.overlay,th.x,td.x,th.tm,td.tm{display:none!important}
  .sheetwrap{background:none;padding:0;overflow:visible;border-radius:0}
  .sheet{box-shadow:none;min-width:0;max-width:none;width:100%;padding:0;margin:0}
  td:hover{background:none}
  #sheets{display:block}
  .pagetag{display:none!important}
  .sheet{break-after:page}
  .sheet:last-child{break-after:auto}
}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div>
      <h1>حركة السيارات</h1>
    </div>
    <div class="date" role="group" aria-label="التاريخ">
      <button id="prev" class="icon" type="button" aria-label="اليوم السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <button id="dlabel" class="dlabel" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="dtext"></span></button>
      <input id="date" class="dhidden" type="date" tabindex="-1" aria-label="اختيار التاريخ">
      <button id="next" class="icon" type="button" aria-label="اليوم التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <button id="today" class="chip" type="button">اليوم</button>
    </div>
  </header>

  <section class="panel" aria-label="الأدوات">
    <button id="pick" class="drop" type="button">
      <b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>رفع ملف ByDate</b>
      <span class="hint">اضغط لاختيار الملف أو اسحبه وأفلته هنا (xls، xlsx، csv)</span>
    </button>
    <input id="file" type="file" accept=".xls,.xlsx,.csv" hidden>
    <div class="stats" aria-label="ملخص">
      <div class="stat"><small>عدد السيارات</small><strong id="stCount">0</strong></div>
      <div class="stat"><small>أول دخول</small><strong id="stFirst">--:--</strong></div>
      <div class="stat"><small>آخر دخول</small><strong id="stLast">--:--</strong></div>
    </div>
    <div class="actions">
      <div class="end">
        <button id="print" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg>طباعة</button>
        <button id="export" class="primary" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0-4-4m4 4 4-4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>تصدير إكسل</button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="sheetwrap" aria-label="النموذج">
    <div id="sheets"></div>
    <template id="tpl">
    <div class="sheet"><div class="pagetag" hidden></div>

<script>
(function(){
  var MIN_ROWS = 20;                      // the printed form has 20 lines
  var FONT = 'Times New Roman', SIZE = 14;
  var FIELDS = ['car','wt','cust','mat','ticket'];   // car nu, first weight, customer name, material, ticket number
  var HEADERS = ['list','car nu','first weight','customer name','material','ticket number'];

  var $ = function(id){ return document.getElementById(id); };
  var rows = [];
  var LOGO = document.getElementById('tpl').content.querySelector('img').src;
  var dateTouched = false;
  var downloads = null;

  function blank(){ return {car:'',wt:'',cust:'',mat:'',ticket:'',time:''}; }
  function updateStats(){
    var used = rows.filter(function(r){ return r.car || r.cust || r.wt || r.mat; });
    var times = used.map(function(r){ return r.time; }).filter(Boolean);
    $('stCount').textContent = String(used.length);
    $('stFirst').textContent = times.length ? times[0] : '--:--';
    $('stLast').textContent = times.length ? times[times.length-1] : '--:--';
  }
  var PER = MIN_ROWS;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2800); }
  function setStatus(msg, cls){ var s = $('status'); s.textContent = msg; s.className = 'status ' + (cls||''); }

  /* ---------- date ---------- */
  function pad2(n){ return String(n).padStart(2,'0'); }
  function todayISO(){ var d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseISO(iso){ var p = (iso||'').split('-'); return p.length===3 ? new Date(+p[0], +p[1]-1, +p[2]) : null; }
  function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function dateText(iso){ var p = (iso||'').split('-'); return p.length===3 ? p[2]+' / '+p[1]+' / '+p[0] : ''; }
  function longDate(iso){
    var d = parseISO(iso); if(!d) return '';
    try{ return new Intl.DateTimeFormat('ar-u-ca-gregory-nu-latn', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(d); }
    catch(e){ return dateText(iso); }
  }
  function renderDate(){
    var iso = $('date').value;
    $('dtext').textContent = longDate(iso);
    document.querySelectorAll('.dateline').forEach(function(d){ d.textContent = 'التاريخ: ' + dateText(iso); });
  }
  function setDate(iso, manual){ $('date').value = iso; if(manual) dateTouched = true; renderDate(); }
  function shiftDay(n){ var d = parseISO($('date').value) || new Date(); d.setDate(d.getDate()+n); setDate(toISO(d), true); }
  setDate(todayISO(), false);
  $('date').addEventListener('input', function(){ dateTouched = true; renderDate(); });
  $('prev').addEventListener('click', function(){ shiftDay(-1); });
  $('next').addEventListener('click', function(){ shiftDay(1); });
  $('today').addEventListener('click', function(){ dateTouched = false; setDate(todayISO(), false); });
  $('dlabel').addEventListener('click', function(){
    var inp = $('date');
    try{ inp.showPicker(); }catch(e){ inp.classList.add('show'); inp.focus(); }
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && !dateTouched) setDate(todayISO(), false); });

  /* ---------- table ---------- */
  function focusCell(i, f){ var el = $('c-'+i+'-'+f); if(el){ el.focus(); } }
  function hasData(r){ return !!(r.car || r.wt || r.cust || r.mat || r.ticket); }
  function buildRow(i, n){
    var r = rows[i];
    var tr = document.createElement('tr');
    var nc = document.createElement('td'); nc.className = 'n'; nc.textContent = String(n); tr.appendChild(nc);
    FIELDS.forEach(function(f){
      var td = document.createElement('td');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = r[f]; inp.id = 'c-'+i+'-'+f; inp.autocomplete = 'off';
      inp.setAttribute('aria-label', HEADERS[FIELDS.indexOf(f)+1]+' '+(i+1));
      if(f==='car'||f==='wt'||f==='ticket') inp.inputMode = 'numeric';
      inp.addEventListener('input', function(){ r[f] = inp.value; });
      inp.addEventListener('focus', function(){ inp.select(); });
      inp.addEventListener('keydown', function(e){
        if(e.key==='Enter' || e.key==='ArrowDown'){
          e.preventDefault();
          if(i+1 < rows.length) focusCell(i+1, f);
        }else if(e.key==='ArrowUp'){
          e.preventDefault(); if(i>0) focusCell(i-1, f);
        }
      });
      td.appendChild(inp); tr.appendChild(td);
    });
    var tm = document.createElement('td'); tm.className = 'tm'; tm.textContent = r.time || ''; tr.appendChild(tm);
    var x = document.createElement('td'); x.className = 'x';
    var b = document.createElement('button'); b.type = 'button'; b.textContent = '×';
    b.setAttribute('aria-label','حذف الصف '+(i+1)); b.title = 'حذف الصف';
    b.addEventListener('click', function(){ rows.splice(i,1); render(); });
    x.appendChild(b); tr.appendChild(x);
    return tr;
  }
  // one paper sheet per 20 trucks; each sheet is numbered 1..20 again
  function render(){
    var last = -1; rows.forEach(function(r, i){ if(hasData(r)) last = i; });
    rows.length = last + 1;
    var pages = Math.max(1, Math.ceil(rows.length / PER));
    while(rows.length < pages*PER) rows.push(blank());
    var host = $('sheets'); host.innerHTML = '';
    for(var p=0;p<pages;p++){
      var frag = $('tpl').content.cloneNode(true);
      var tag = frag.querySelector('.pagetag');
      if(pages > 1){ tag.hidden = false; tag.textContent = 'ورقة '+(p+1)+' من '+pages; }
      var body = frag.querySelector('.body');
      for(var k=0;k<PER;k++) body.appendChild(buildRow(p*PER+k, k+1));
      host.appendChild(frag);
    }
    renderDate(); updateStats();
  }
  window.__setRows = function(a){ rows = a; render(); };

  /* ---------- import ---------- */
  function norm(s){ return String(s==null?'':s).trim().toLowerCase(); }
  function toNum(v){
    if(typeof v === 'number') return v;
    var t = String(v==null?'':v).replace(/,/g,'').trim();
    return t === '' ? NaN : Number(t);
  }
  function fmtThousands(v){ var n = toNum(v); return isFinite(n) ? n.toLocaleString('en-US') : String(v==null?'':v).trim(); }
  function fmtPlain(v){ return typeof v === 'number' ? String(v) : String(v==null?'':v).trim(); }

  // aoa = rows of the first sheet. car nu <- DVehiCode, first weight <- FirstWt.
  // Headers are matched loosely; a missing header falls back to the standard ByDate column position.
  function key(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,''); }
  var ALIASES = {
    transno:  ['transno','transactionno','transid','ticketno','ticket'],
    dvehicode:['dvehicode','vehicode','vehiclecode','vehicleno','vehicle','carno','carnu','platecode'],
    firstwt:  ['firstwt','firstweight','firstw','wt1','weight1'],
    dprodname:['dprodname','prodname','productname','product','material'],
    datein:   ['datein','entrydate','datefirst','date1'],
    timein:   ['timein','entrytime','timefirst','time1'],
    supcust:  ['supcust','supcustname','customername','customer','custname','cust','suppliercustomer','supplier']
  };
  var STD_POS = {datein:0, timein:1, transno:4, dvehicode:5, dprodname:7, firstwt:9, supcust:16};   // A, B, E, F, H, J, Q
  var LABEL = {transno:'TransNo', dvehicode:'DVehiCode', dprodname:'DProdName', firstwt:'FirstWt', supcust:'SupCust', datein:'DateIn', timein:'TimeIn'};


  // ---- entry time = DateIn + TimeIn (first weighing). Accepts Excel serials, Date objects, "01:15:00 PM", "13:15", Arabic ص/م.
  function dayNumber(v){
    if(typeof v === 'number') return isFinite(v) ? Math.floor(v) : NaN;
    if(v instanceof Date) return Math.floor(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())/86400000) + 25569;
    var t = String(v==null?'':v).trim(), m;
    if((m = t.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/))) return Math.floor(Date.UTC(+m[1], +m[2]-1, +m[3])/86400000) + 25569;
    if((m = t.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/))){
      var a = +m[1], b = +m[2], mo = a, d = b;
      if(a > 12){ mo = b; d = a; }                       // dd/mm/yyyy when the first part cannot be a month
      return Math.floor(Date.UTC(+m[3], mo-1, d)/86400000) + 25569;
    }
    return NaN;
  }
  function daySeconds(v){
    if(typeof v === 'number') return isFinite(v) ? Math.round((v - Math.floor(v)) * 86400) : NaN;
    if(v instanceof Date) return v.getHours()*3600 + v.getMinutes()*60 + v.getSeconds();
    var t = String(v==null?'':v).trim(), m = t.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm]|ص|م)?/);
    if(!m) return NaN;
    var h = +m[1], mi = +m[2], se = +(m[3]||0), ap = (m[4]||'').toLowerCase();
    if(ap){
      var pm = (ap === 'pm' || ap === 'م');
      if(h === 12) h = pm ? 12 : 0; else if(pm) h += 12;
    }
    return h*3600 + mi*60 + se;
  }
  function fmtClock(sec){
    if(!isFinite(sec)) return '';
    var h24 = Math.floor(sec/3600) % 24, m = Math.floor(sec%3600/60);
    return pad2(h24 % 12 || 12)+':'+pad2(m)+' '+(h24 >= 12 ? 'PM' : 'AM');
  }

  function parseReport(aoa, warn){
    var h = -1;
    for(var i=0;i<aoa.length;i++){
      if((aoa[i]||[]).some(function(c){ return ALIASES.transno.indexOf(key(c))>=0; })){ h = i; break; }
    }
    if(h < 0){
      var seen = (aoa[0]||[]).concat(aoa[1]||[]).filter(function(c){ return String(c).trim(); }).slice(0,12).join(' , ');
      throw new Error('ما لقيت عمود TransNo. العناوين اللي في الملف: ' + (seen || 'لا يوجد'));
    }
    var head = aoa[h], idx = {};
    Object.keys(ALIASES).forEach(function(k){
      for(var c=0;c<head.length;c++){ if(ALIASES[k].indexOf(key(head[c]))>=0){ idx[k] = c; break; } }
    });
    var body = aoa.slice(h+1).filter(function(r){ return r && isFinite(toNum(r[idx.transno])); });
    // fallback 1: the standard ByDate position; fallback 2 (customer only): rightmost mostly-text column
    Object.keys(STD_POS).forEach(function(k){
      if(k in idx) return;
      var pos = STD_POS[k];
      if(body.some(function(r){ return String(r[pos]==null?'':r[pos]).trim() !== ''; })) idx[k] = pos;
    });
    if(!('supcust' in idx)){
      var width = Math.max.apply(null, body.map(function(r){ return r.length; }).concat([0]));
      var used = Object.keys(idx).map(function(k){ return idx[k]; });
      for(var c=width-1;c>=0;c--){
        if(used.indexOf(c)>=0) continue;
        var txt = body.filter(function(r){ var x = r[c]; return typeof x === 'string' && /[A-Za-z\u0600-\u06FF]{2,}/.test(x); }).length;
        if(body.length && txt >= body.length*0.6){ idx.supcust = c; break; }
      }
    }
    var missing = Object.keys(ALIASES).filter(function(k){ return !(k in idx); }).map(function(k){ return LABEL[k]; });
    if(warn && missing.length) warn(missing);
    var g = function(r,k){ return k in idx ? r[idx[k]] : ''; };
    var out = body.map(function(r, i){
      var d = dayNumber(g(r,'datein')), sec = daySeconds(g(r,'timein'));
      var ts = (isFinite(d) ? d : 0) * 86400 + (isFinite(sec) ? sec : 0);
      return {ts: (isFinite(sec) || isFinite(d)) ? ts : Infinity, t:toNum(r[idx.transno]), i:i,
              time: fmtClock(sec),
              car:fmtPlain(g(r,'dvehicode')), wt:fmtThousands(g(r,'firstwt')),
              cust:fmtPlain(g(r,'supcust')), mat:fmtPlain(g(r,'dprodname')), ticket:''};
    });
    // earliest first weighing gets 1; ties keep the TransNo order, then the file order
    out.sort(function(a,b){
      if(a.ts !== b.ts) return a.ts < b.ts ? -1 : 1;
      if(a.t !== b.t) return a.t - b.t;
      return a.i - b.i;
    });
    return out.map(function(o){ delete o.ts; delete o.t; delete o.i; return o; });
  }
  window.__parseReport = parseReport;

  function loadFile(file){
    if(!file) return;
    if(typeof XLSX === 'undefined'){ setStatus('تعذّر تحميل مكتبة قراءة إكسل. تأكد من الاتصال بالإنترنت وأعد فتح الصفحة.', 'err'); return; }
    file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, {type:'array', cellDates:false});
      var ws = wb.Sheets[wb.SheetNames[0]];
      try{
        var maxR = 0, maxC = 0;
        Object.keys(ws).forEach(function(k){ if(k.charAt(0)==='!') return; var c = XLSX.utils.decode_cell(k); if(c.r>maxR) maxR=c.r; if(c.c>maxC) maxC=c.c; });
        ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxR,c:maxC}});
      }catch(e){}
      var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      var miss = null;
      var res = parseReport(aoa, function(m){ miss = m; });
      if(!res.length) throw new Error('الملف ما فيه حركات.');
      var n = res.length; rows = res; render();
      var noTime = miss && (miss.indexOf('DateIn') >= 0 || miss.indexOf('TimeIn') >= 0);
      var other = miss ? miss.filter(function(m){ return m !== 'DateIn' && m !== 'TimeIn'; }) : [];
      if(noTime) setStatus('تم استيراد '+n+' حركة، لكن ما لقيت عمود DateIn أو TimeIn، فالترتيب حسب رقم العملية وليس وقت الدخول.', 'err');
      else if(other.length) setStatus('تم استيراد '+n+' حركة مرتبة حسب وقت الدخول، لكن ما لقيت عمود: '+other.join('، ')+'. عبّي خانته يدويًا.', 'err');
      else setStatus('تم استيراد '+n+' حركة، مرتبة من 1 حسب وقت الدخول', 'ok');
    }).catch(function(e){
      setStatus(e && e.message ? e.message : 'تعذّرت قراءة الملف.', 'err');
    });
  }
  var fileInput = $('file');
  $('pick').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){ loadFile(fileInput.files[0]); fileInput.value = ''; });
  var depth = 0, ov = $('overlay');
  window.addEventListener('dragenter', function(e){ e.preventDefault(); depth++; ov.classList.add('on'); });
  window.addEventListener('dragleave', function(e){ e.preventDefault(); depth = Math.max(0, depth-1); if(!depth) ov.classList.remove('on'); });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){ e.preventDefault(); depth = 0; ov.classList.remove('on'); if(e.dataTransfer && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]); });

  /* ---------- saving ---------- */
  async function saveFile(name, blob){
    if(downloads) return downloads.save({filename:name, data:blob});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return {status:'saved'};
  }
  function fileDate(){ return $('date').value || todayISO(); }
  function cellValue(text, thousands){
    var t = String(text==null?'':text).trim();
    if(/^\d[\d,]*(\.\d+)?$/.test(t) && !/^0\d/.test(t)) return {v:Number(t.replace(/,/g,'')), fmt: thousands ? '#,##0' : '0'};
    return {v:t, fmt:null};
  }

  /* ---------- Excel ---------- */
  function buildSheet(wb, logoId, iso, data, p, pages){
    var ws = wb.addWorksheet('حركة السيارات' + (pages > 1 ? ' ' + (p+1) : ''), {
      pageSetup:{paperSize:9, orientation:'portrait', fitToPage:true, fitToWidth:1, fitToHeight:0, horizontalCentered:true,
                 margins:{left:0.3,right:0.3,top:0.3,bottom:0.3,header:0.2,footer:0.2}},
      views:[{showGridLines:false}]
    });
    ws.columns = [{width:8},{width:16},{width:18},{width:34},{width:26},{width:16}];
    var font = function(bold){ return {name:FONT, size:SIZE, bold:!!bold}; };
    var thin = {style:'thin', color:{argb:'FF000000'}};
    var box = {top:thin,left:thin,bottom:thin,right:thin};
    var H = 7;
    data = data.slice(); while(data.length < PER) data.push(blank());
    var last = H + data.length;
    for(var r=1;r<=last;r++) for(var c=1;c<=6;c++) ws.getCell(r,c).font = font(false);

    ['حركة السيارات','مصنع موجة للأسفلت','MOJAH ASPHALT FACTORY'].forEach(function(t, i){
      var rr = i+1; ws.mergeCells('B'+rr+':E'+rr);
      var cell = ws.getCell('B'+rr); cell.value = t; cell.font = font(true);
      cell.alignment = {horizontal:'center', vertical:'middle'};
      ws.getRow(rr).height = 26;
    });
    ws.addImage(logoId, {tl:{col:0.15,row:0.1}, ext:{width:84,height:84}});
    ws.addImage(logoId, {tl:{col:5.1,row:0.1}, ext:{width:84,height:84}});

    ws.mergeCells('D5:F5');
    var dc = ws.getCell('D5'); dc.value = 'التاريخ: ' + dateText(iso); dc.font = font(true);
    dc.alignment = {horizontal:'right', vertical:'middle', readingOrder:'rtl'};
    ws.getRow(5).height = 26;

    HEADERS.forEach(function(h, k){
      var c = ws.getCell(H, k+1); c.value = h; c.font = font(true); c.border = box;
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    });
    ws.getRow(H).height = 28;

    data.forEach(function(row, i){
      var rn = H+1+i;
      var vals = [
        {v:i+1, fmt:'0', bold:true},
        cellValue(row.car, false),
        cellValue(row.wt, true),
        {v:String(row.cust||'').trim(), fmt:null},
        {v:String(row.mat||'').trim(), fmt:null},
        cellValue(row.ticket, false)
      ];
      vals.forEach(function(o, k){
        var c = ws.getCell(rn, k+1);
        c.value = (o.v === '' ? null : o.v);
        c.font = font(true); c.border = box;
        c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
        if(o.fmt && typeof o.v === 'number') c.numFmt = o.fmt;
      });
      ws.getRow(rn).height = 36;
    });
  }
  async function buildWorkbook(){
    var iso = $('date').value;
    var wb = new ExcelJS.Workbook();
    var logoId = wb.addImage({base64: LOGO, extension:'png'});
    var pages = Math.max(1, Math.ceil(rows.length / PER));
    for(var p=0;p<pages;p++) buildSheet(wb, logoId, iso, rows.slice(p*PER, p*PER+PER), p, pages);
    return wb;
  }
  $('export').addEventListener('click', async function(){
    if(typeof ExcelJS === 'undefined'){ toast('تعذّر تحميل مكتبة التصدير. تأكد من الاتصال بالإنترنت.'); return; }
    var btn = $('export'); btn.disabled = true;
    try{
      var wb = await buildWorkbook();
      var buf = await wb.xlsx.writeBuffer();
      var blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      var res = await saveFile('حركة السيارات '+fileDate()+'.xlsx', blob);
      toast(res && res.status === 'saved' ? 'تم حفظ ملف الإكسل' : 'تم');
    }catch(e){
      toast(e && e.code === 'declined' ? 'تم إلغاء الحفظ' : 'ما قدرت أصدّر الملف' + (e && e.message ? ': '+e.message : ''));
    }finally{ btn.disabled = false; }
  });

  /* ---------- print: the paper only ---------- */
  async function sheetToPdf(){
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    var els = $('sheets').querySelectorAll('.sheet');
    for(var k=0;k<els.length;k++){
      var canvas = await html2canvas(els[k], {
        scale:3, backgroundColor:'#ffffff', useCORS:true,
        onclone:function(doc){
          doc.querySelectorAll('th.x,td.x,th.tm,td.tm,.pagetag').forEach(function(el){ el.remove(); });
          doc.querySelectorAll('.sheet').forEach(function(sh){ sh.style.boxShadow = 'none'; });
          doc.querySelectorAll('.sheet td input').forEach(function(inp){
            var d = doc.createElement('div');
            d.textContent = inp.value;
            d.style.cssText = 'min-height:32px;line-height:32px;text-align:center;padding:0 4px;word-break:break-word;font-weight:700';
            inp.replaceWith(d);
          });
        }
      });
      var m = 8, w = 210 - 2*m, h = canvas.height * w / canvas.width;
      if(h > 297 - 2*m){ h = 297 - 2*m; w = canvas.width * h / canvas.height; }
      if(k > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', (210 - w)/2, m, w, h);
    }
    return pdf.output('blob');
  }
  $('print').addEventListener('click', async function(){
    if(!downloads){ window.print(); return; }       // opened as a local file: normal print dialog, paper only
    if(typeof html2canvas === 'undefined' || !window.jspdf){ toast('تعذّر تحميل مكتبة الطباعة. تأكد من الاتصال بالإنترنت.'); return; }
    var btn = $('print'); btn.disabled = true;
    try{
      var blob = await sheetToPdf();
      var res = await downloads.save({filename:'حركة السيارات '+fileDate()+'.pdf', data:blob});
      toast(res && res.status === 'saved' ? 'تم حفظ ملف PDF، افتحه واطبعه' : 'تم');
    }catch(e){
      toast(e && e.code === 'declined' ? 'تم إلغاء الحفظ' : 'ما قدرت أجهّز ملف الطباعة');
    }finally{ btn.disabled = false; }
  });

  /* ---------- start ---------- */
  render();
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(d){ downloads = d; }).catch(function(){});
  }
})();
</script>
