<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>عرض سعر - موجة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf1;font-family:Tahoma,Arial,sans-serif;color:#111}
.panel{max-width:760px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
.card h3{margin:0 0 8px;font-size:16px;color:#1a6fa8}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
label{font-size:12px;color:#555;display:block;margin-bottom:2px}
input,textarea{width:100%;padding:9px;border:1px solid #bcc7d1;border-radius:8px;font:inherit;font-size:16px}
button{padding:10px 14px;border:0;border-radius:8px;background:#1a6fa8;color:#fff;font:inherit;font-size:15px;cursor:pointer}
button.move{padding:5px 9px}
button.alt{background:#6b7b88}button.del{background:#c0392b;padding:5px 9px}
.items{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.items td{border-bottom:1px solid #e1e6ea;padding:5px 3px}
.items input{padding:5px;font-size:14px}
.ltr{direction:ltr;text-align:left}
.wrap{overflow:hidden;margin:0 auto}

function rememberCustomer(n){n=String(n||'').trim();if(n&&!customers.some(function(c){return c.toLowerCase()===n.toLowerCase()}))customers.push(n)}
function renderCustomerOptions(){$('customerOptions').innerHTML=customers.map(function(c){return '<option value="'+esc(c)+'"></option>'}).join('')}
function customerInput(){var input=$('cust'),typed=input.value.trim(),key=typed.toLowerCase();if(key){var match=customers.find(function(c){return c.toLowerCase().indexOf(key)===0&&c.toLowerCase()!==key});if(match){input.value=match;input.setSelectionRange(typed.length,match.length)}}save2()}
function rememberCurrentCustomer(){rememberCustomer($('cust').value);renderCustomerOptions();save2()}
function rememberProduct(n,q,p){if(!n)return;var key=String(n).trim().toLowerCase(),found=products.find(function(r){return String(r[0]).trim().toLowerCase()===key});if(found){found[1]=q;found[2]=p}else products.push([n,q,p])}
function renderProductOptions(){$('productOptions').innerHTML=products.map(function(r){return '<option value="'+esc(r[0])+'"></option>'}).join('')}
function selectProduct(){var n=$('n').value.trim().toLowerCase(),product=products.find(function(r){return String(r[0]).trim().toLowerCase()===n});if(product){$('q').value=product[1];$('p').value=product[2]}}
function save(){var o={items:items,products:products,customers:customers};F.forEach(function(f){o[f]=$(f).value});try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}render()}
function add(){var n=$('n').value.trim();if(!n)return;var q=$('q').value.trim(),p=$('p').value.trim();items.push([n,q,p]);rememberProduct(n,q,p);$('n').value=$('q').value=$('p').value='';save()}
function upd(i,j,v){items[i][j]=v;save2()}
function save2(){var o={items:items,products:products,customers:customers};F.forEach(function(f){o[f]=$(f).value});try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}renderPage()}
function del(i){items.splice(i,1);save()}
function mv(i,d){var j=i+d;if(j<0||j>=items.length)return;var t=items[i];items[i]=items[j];items[j]=t;save()}
function render(){
 renderCustomerOptions();
 $('list').innerHTML=items.map(function(r,i){return '<tr><td><input class="ltr" value="'+esc(r[0])+'" oninput="upd('+i+',0,this.value)"></td><td><input class="ltr" value="'+esc(r[1])+'" oninput="upd('+i+',1,this.value)"></td><td><input value="'+esc(r[2])+'" inputmode="decimal" oninput="upd('+i+',2,this.value)"></td><td style="white-space:nowrap"><button class="move" title="تحريك صف واحد لأعلى" onclick="mv('+i+',-1)">▲</button> <button class="move" title="تحريك صف واحد لأسفل" onclick="mv('+i+',1)">▼</button> <button class="del" onclick="del('+i+')">✕</button></td></tr>'}).join('');
 renderPage()}
function renderPage(){
 $('vb').innerHTML=items.map(function(r){return '<tr><td class="en">'+esc(r[0])+'</td><td class="en">'+esc(r[1])+'</td><td>'+esc(r[2])+' ر.س</td></tr>'}).join('');
 $('vd').textContent=fd($('date').value);$('vc').textContent=$('cust').value;
 $('vt').innerHTML=$('terms').value.split('\n').filter(Boolean).map(function(t){return '<div>'+esc(t)+'</div>'}).join('');
 $('v1').textContent=$('s1').value;$('v2').textContent=$('s2').value;$('vp').textContent=$('ph').value}
F.forEach(function(f){$(f).addEventListener('input',save2)});
$('n').addEventListener('change',selectProduct);
renderProductOptions();
function fit(){var w=Math.min(window.innerWidth,760)-16,pw=$('page').offsetWidth,sc=Math.min(1,w/pw);
 $('page').style.transform='scale('+sc+')';$('wrap').style.width=(pw*sc)+'px';$('wrap').style.height=($('page').offsetHeight*sc)+'px'}
window.addEventListener('resize',fit);
var printed=false;
function printFit(){
 var c=$('content');
 c.style.transform='none';c.style.width='';c.style.height='';c.style.left='';c.style.top='';c.style.bottom='';
 var sc=Math.min(1,c.clientHeight/c.scrollHeight);
 if(sc<1){
  sc=sc*0.995;
  var h=c.clientHeight,w=c.clientWidth;
  /* نوسّع الصندوق بنفس نسبة التصغير ثم نصغّره فيملأ العرض والارتفاع بالظبط (بدون ميل لليمين) */
  c.style.left='auto';c.style.bottom='auto';
  c.style.width=(w/sc)+'px';c.style.height=(h/sc)+'px';
  c.style.transformOrigin='top right';
  c.style.transform='scale('+sc+')';
 }
 printed=true;
}
function printReset(){
 if(!printed)return;
 var c=$('content');
 c.style.transform='';c.style.transformOrigin='';c.style.width='';c.style.height='';c.style.left='';c.style.bottom='';
 printed=false;fit();
}
window.addEventListener('beforeprint',function(){$('page').style.transform='none';printFit()});
window.addEventListener('afterprint',printReset);
if(window.matchMedia){var mq=window.matchMedia('print');var mqh=function(e){if(e.matches){$('page').style.transform='none';printFit()}else printReset()};if(mq.addEventListener)mq.addEventListener('change',mqh);else if(mq.addListener)mq.addListener(mqh)}
render();fit();
</script></body></html>
