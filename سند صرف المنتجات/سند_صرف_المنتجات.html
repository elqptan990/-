<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#12213F">
<meta name="application-name" content="سند صرف المنتجات">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2312213F'/%3E%3Crect x='20' y='18' width='60' height='64' rx='8' fill='%23fff'/%3E%3Cpath d='M30 35h40M30 48h40M30 61h25' stroke='%23D98E2B' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<title>سند صرف المنتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12213F;
    --navy-2:#1C3564;
    --slate:#48566E;
    --paper:#F6F3EC;
    --paper-2:#FFFFFF;
    --line:#D9D2C2;
    --amber:#D98E2B;
    --amber-deep:#B5721A;
    --green:#2F6B4F;
    --red:#B23A32;
    --ink:#1B1B18;
    --muted:#7A7568;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    font-weight:500;
    min-height:100vh;
  }
  b,strong{font-weight:900;}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:700;}

  /* ---------- App shell (sidebar layout) ---------- */
  #app-shell{display:flex;min-height:100vh;}

  #sidebar{
    background:var(--navy);color:#fff;width:236px;flex:none;
    position:fixed;top:0;bottom:0;right:0;z-index:80;
    display:flex;flex-direction:column;
    transition:transform .25s ease;
    box-shadow:-4px 0 18px rgba(0,0,0,.12);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:18px 16px 14px 16px;
    border-bottom:1px dashed rgba(255,255,255,.22);
  }
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);flex:none;}
  .brand h1{font-size:15.5px;margin:0;font-weight:900;letter-spacing:.2px;}
  .brand span{display:block;font-size:10.5px;color:#B9C2D6;font-weight:600;margin-top:1px;}

  nav#tabs{
    display:flex;flex-direction:column;gap:2px;
    padding:14px 10px;overflow-y:auto;
  }
  nav#tabs button{
    background:none;border:none;color:#CBD3E3;text-align:right;
    font-family:inherit;font-size:14px;font-weight:700;
    padding:11px 12px;white-space:nowrap;cursor:pointer;
    border-radius:8px;
    border-right:3px solid transparent;
    display:flex;align-items:center;gap:9px;
  }
  nav#tabs button:hover{background:rgba(255,255,255,.06);}
  nav#tabs button.active{
    color:#fff;background:rgba(217,142,43,.16);
    border-right:3px solid var(--amber);
  }
  nav#tabs button .ic{font-size:15px;flex:none;}

  #sidebar-footer{
    margin-top:auto;padding:12px 14px 16px 14px;
    font-size:10.5px;color:#8FA0C2;border-top:1px dashed rgba(255,255,255,.18);
  }

  #topbar-mobile{
    display:none;
    position:sticky;top:0;z-index:70;
    background:var(--navy);color:#fff;
    padding:12px 14px;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  #topbar-mobile .brand{padding:0;border:none;}
  #hamburger{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;
    border-radius:8px;padding:8px 11px;font-size:16px;cursor:pointer;
  }
  #sidebar-backdrop{
    display:none;position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:75;
  }

  #main-wrap{flex:1;margin-right:236px;min-width:0;}
  main{max-width:980px;margin:0 auto;padding:22px 22px 60px 22px;}

  @media(max-width:900px){
    #sidebar{transform:translateX(100%);}
    #sidebar.open{transform:translateX(0);}
    #sidebar-backdrop.open{display:block;}
    #main-wrap{margin-right:0;}
    #topbar-mobile{display:flex;}
    main{padding:14px 12px 50px 12px;}
  }

  h2.page-title{
    font-size:19px;margin:2px 0 4px 0;font-weight:900;color:var(--navy);
  }
  p.page-sub{color:var(--muted);font-size:13px;margin:0 0 16px 0;font-weight:600;}

  .dashed{border:none;border-top:2px dashed var(--line);margin:18px 0;}

  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h3{margin:0 0 10px 0;font-size:14.5px;color:var(--navy);font-weight:900;}

  .grid{display:grid;gap:10px;}
  .grid.g2{grid-template-columns:1fr 1fr;}
  .grid.g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:640px){.grid.g2,.grid.g3{grid-template-columns:1fr;}}

  label{font-size:12.5px;color:var(--slate);font-weight:700;display:block;margin-bottom:4px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;
    border:1px solid var(--line);
    background:#FBFAF6;
    border-radius:7px;
    padding:9px 10px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
  .field{margin-bottom:10px;}

  button.btn{
    font-family:inherit;font-weight:700;font-size:13.5px;
    border-radius:7px;border:1px solid transparent;
    padding:10px 16px;cursor:pointer;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-amber{background:var(--amber);color:#20140A;}
  .btn-amber:hover{background:var(--amber-deep);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--slate);}
  .btn-ghost:hover{border-color:var(--slate);}
  .btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn-danger:hover{background:var(--red);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  table.list{width:100%;border-collapse:collapse;font-size:13px;}
  table.list th{
    text-align:right;color:var(--muted);font-weight:700;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;
    border-bottom:2px dashed var(--line);padding:6px 8px;
  }
  table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.list tr:hover td{background:#FBF6EA;}
  .pill{
    display:inline-block;background:var(--navy);color:#fff;font-size:11px;
    padding:2px 8px;border-radius:20px;font-weight:700;
  }
  .pill.amber{background:var(--amber);color:#20140A;}
  .muted{color:var(--muted);}
  .empty{
    text-align:center;padding:36px 12px;color:var(--muted);
    border:2px dashed var(--line);border-radius:10px;font-size:13.5px;
  }

  .search-box{position:relative;margin-bottom:12px;}
  .search-box input{padding-right:34px;}
  .search-box::before{
    content:"⌕";position:absolute;right:11px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:16px;
  }

  .item-row{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 42px;gap:8px;
    align-items:end;margin-bottom:8px;
    padding-bottom:8px;border-bottom:1px dashed var(--line);
  }
  .items-card-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid #334155}
  .items-card-heading h3{margin:0!important;padding:0!important;border:0!important;flex:1}
  .items-card-heading .save-new-voucher-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 14px;border:1px solid #3B82F6;border-radius:9px;background:#2563EB;color:#fff;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(37,99,235,.22)}
  .items-card-heading .save-new-voucher-btn:hover{background:#1D4ED8;border-color:#60A5FA;box-shadow:0 5px 14px rgba(37,99,235,.3)}
  .items-card-heading .save-new-voucher-btn:disabled{opacity:.65;cursor:wait;transform:none;box-shadow:none}
  .save-new-voucher-icon{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.18);font-size:16px;line-height:1}
  @media(max-width:420px){.items-card-heading{gap:8px}.items-card-heading .save-new-voucher-btn{padding:7px 9px;font-size:12px}}
  @media(max-width:640px){.item-row{grid-template-columns:1fr 1fr;}}
  .qty-picker{position:relative}
  .item-row .field label{display:block;height:18px;margin:0 0 6px;text-align:center;line-height:18px}
  .item-row .field>input,.qty-picker-input input{box-sizing:border-box;width:100%;height:42px;min-width:0;padding:8px;font:inherit;color:#F8FAFC;text-align:center;border-radius:9px}
  .qty-picker-input{display:flex;gap:0;align-items:stretch}
  .joined-picker{box-sizing:border-box;overflow:hidden;border:1px solid #475569;border-radius:9px;background:#0F172A;transition:border-color .15s,box-shadow .15s}
  .qty-picker-input.joined-picker{height:42px;min-height:42px}
  .qty-picker-input.joined-picker input{box-sizing:border-box;flex:1 1 0%;width:0;min-width:0;height:100%;margin:0;padding:8px 10px;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;line-height:1.2}
  .qty-picker-input.joined-picker .numeric-input-shell{box-sizing:border-box;display:flex;flex:1 1 0%;width:0;min-width:0;height:100%}
  .numeric-input-shell{position:relative;min-width:0;height:42px}
  .numeric-input-shell input.it-item,.numeric-input-shell input.it-qty,.numeric-input-shell input.it-drum{color:transparent!important;-webkit-text-fill-color:transparent;caret-color:#38BDF8}
  .numeric-input-shell input.it-item::placeholder,.numeric-input-shell input.it-qty::placeholder,.numeric-input-shell input.it-drum::placeholder{color:transparent!important;-webkit-text-fill-color:transparent}
  .numeric-input-display{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:0 8px;overflow:hidden;white-space:pre;direction:ltr;unicode-bidi:isolate;pointer-events:none;font:inherit;text-align:center;color:#F8FAFC}
  .numeric-input-display .numeric-input-number{color:#38BDF8;font-weight:900}
  .numeric-input-display.is-placeholder{color:#94A3B8}
  .qty-list-toggle{box-sizing:border-box;flex:0 0 36px;width:36px;min-width:36px;height:42px;padding:0!important;display:flex;align-items:center;justify-content:center;border-radius:9px 0 0 9px;font:inherit;line-height:1}
  .qty-picker-input.joined-picker .qty-list-toggle{height:100%;border:0!important;border-right:1px solid #334155!important;border-radius:0!important;background:#1E293B!important;color:#CBD5E1!important}
  .qty-picker-input.joined-picker .qty-list-toggle:hover{background:#29364A!important;color:#fff!important}
  .qty-picker-input.joined-picker:focus-within{border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,.22)}
  .item-row>[data-del-item]{box-sizing:border-box;width:42px;height:42px;margin-bottom:0;padding:0;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#1E293B;border:1px solid #7F1D1D;color:#FCA5A5}
  .item-row>[data-del-item]:hover{background:#B91C1C;border-color:#DC2626;color:#fff}
  .qty-suggest{position:absolute;top:calc(100% + 3px);right:0;left:0;display:none;max-height:180px;overflow-y:auto;z-index:65;background:#151F32;border:1px solid #475569;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .qty-suggest button{display:block;width:100%;padding:8px 10px;text-align:center;direction:ltr;unicode-bidi:isolate;background:transparent;border:0;border-bottom:1px solid #334155;color:#E2E8F0;cursor:pointer;font:inherit}
  .qty-suggest button:hover{background:#1E3A5F}
  .qty-suggest .numeric-text{color:#38BDF8!important;font-weight:900}
  #products-list .product-value{direction:ltr;unicode-bidi:isolate;text-align:center}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:24px;
    font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
    z-index:200;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;
  }
  .toast.show{opacity:1;bottom:26px;}

  .autofill-box{
    background:#F1F6F2;border:1px solid #CFE3D4;border-radius:8px;
    padding:10px 12px;font-size:13px;color:#20442F;margin-top:8px;
  }
  .autofill-box.empty-state{background:#FBF6EA;border-color:var(--line);color:var(--muted);}

  /* ---------- Modern polish ---------- */
  .quick-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px;}
  .quick-tool{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;text-align:right;transition:.18s;box-shadow:0 2px 8px rgba(18,33,63,.05);}
  .quick-tool:hover{transform:translateY(-1px);border-color:var(--amber);box-shadow:0 5px 16px rgba(18,33,63,.09);}
  .quick-tool .qt-icon{font-size:22px;display:block;margin-bottom:5px}.quick-tool b{font-size:12.5px;color:var(--navy)}
  .save-state{font-size:11px;font-weight:800;margin-right:auto;padding:5px 9px;border-radius:20px;background:#eef7f0;color:#27613f}
  .translator-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
  .translator-grid textarea{min-height:100px;resize:vertical}.translation-results{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.translation-result-card{min-width:0}.translation-result-label{font-size:11px;font-weight:800;color:var(--navy);margin-bottom:3px}  .translation-result{background:#60A5FA;border:1px solid #3B82F6;color:#0F172A;border-radius:8px;padding:4px 7px;font-size:14px;font-weight:900;direction:auto;text-align:start;min-height:30px;white-space:pre-wrap;overflow-wrap:anywhere}
  #dict-translate-input{min-height:36px;height:36px;padding:6px 9px;resize:vertical}
  @media(max-width:600px){.translation-results{grid-template-columns:1fr}}
  .translation-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  @media(max-width:640px){.quick-tools{grid-template-columns:1fr 1fr}.translator-grid{grid-template-columns:1fr}}
  /* ---------- Calibration / print template ---------- */
  .cal-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .cal-panel{flex:1 1 260px;min-width:260px;max-height:70vh;overflow-y:auto;}
  .cal-page-outer{
    flex:2 1 420px;overflow:auto;background:#EDEAE2;border-radius:10px;padding:14px;
    display:flex;justify-content:center;
  }
  .cal-page{
    width:210mm;height:297mm;background:#fff;position:relative;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
    transform-origin:top center;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 10mm),
      repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 1px, transparent 1px 10mm);
  }
  .cal-field{
    position:absolute;white-space:nowrap;cursor:move;
    border:1px dashed var(--amber-deep);
    padding:1px 3px;
    background:rgba(217,142,43,.13);
    user-select:none;
    font-family:'Times New Roman', Times, serif;
    font-weight:700;
  }
  .cal-field.active{border-color:var(--navy);background:rgba(18,33,63,.12);}
  .cal-field .tag{
    position:absolute;top:-17px;right:0;background:var(--navy);color:#fff;
    font-size:9px;padding:1px 5px;border-radius:4px;white-space:nowrap;
  }
  fieldset.fld-edit{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;}
  fieldset.fld-edit legend{font-size:12.5px;font-weight:700;color:var(--navy);padding:0 6px;}
  details.fld-edit{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  details.fld-edit[open]{border-color:var(--amber-deep);}
  details.fld-edit summary{
    list-style:none;cursor:pointer;padding:10px 12px;
    font-size:13px;font-weight:700;color:var(--navy);
    display:flex;align-items:center;justify-content:space-between;
    background:#FBF6EA;
  }
  details.fld-edit summary::-webkit-details-marker{display:none;}
  details.fld-edit summary::after{content:'⌄';color:var(--muted);font-size:15px;}
  details.fld-edit[open] summary::after{content:'⌃';}
  details.fld-edit summary .badge-off{font-size:10.5px;color:var(--muted);font-weight:500;}
  details.fld-edit .body{padding:12px;}
  .nudge-group{display:flex;align-items:center;gap:4px;}
  .nudge-group input{text-align:center;}
  .nudge-btn{
    flex:none;width:26px;height:30px;border:1px solid var(--line);background:#fff;
    border-radius:6px;cursor:pointer;font-size:13px;color:var(--navy);font-weight:700;
  }
  .nudge-btn:hover{background:var(--amber);color:#20140A;border-color:var(--amber-deep);}
  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini-grid label{font-size:11.5px;font-weight:700;color:var(--slate);}
  .mini-grid input,.mini-grid select{padding:7px 8px;font-size:13px;}
  .mini-grid .full{grid-column:1/-1;}
  .visible-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .visible-toggle input{width:auto;}

  /* ---------- Print page (actual output) ---------- */
  #print-root{display:none;}
  .print-page{
    width:210mm;height:297mm;position:relative;background:#fff;
  }
  .pf{position:absolute;white-space:pre;font-weight:700;}

  @media print{
    #app-shell,#main-wrap{display:none !important}
    html,body{height:auto !important;min-height:0 !important;overflow:hidden !important}
    #print-root{position:absolute !important;left:0;top:0;width:210mm}
    html,body{margin:0;padding:0;background:#fff;}
    #sidebar, #sidebar-backdrop, #topbar-mobile, main, #toast, .modal-overlay{display:none !important;}
    #print-root{display:block;margin:0;padding:0;}
    .print-page{margin:0;box-shadow:none;page-break-after:avoid;page-break-before:avoid;page-break-inside:avoid;overflow:hidden;height:294mm !important;}
    @page{size:A4;margin:0;}
  }

  @media(max-width:760px){
    main{padding:12px 10px 50px 10px;}
  }

  /* ---------- Print preview modal ---------- */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(10,15,25,.55);
    z-index:300;align-items:center;justify-content:center;padding:14px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff;border-radius:12px;max-width:640px;width:100%;
    max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .modal-head{
    padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-head h3{margin:0;font-size:15px;color:var(--navy);font-weight:900;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .modal-body{
    flex:1;overflow:auto;background:#EDEAE2;
    display:flex;justify-content:center;padding:18px;
  }
  .print-page.preview-mode{
    transform:scale(.42);transform-origin:top center;
    box-shadow:0 6px 24px rgba(0,0,0,.25);flex:none;
  }
  .modal-foot{
    padding:14px 18px;border-top:1px solid var(--line);
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .confirm-modal{z-index:320}
  .confirm-modal .modal-box{max-width:480px;border:2px solid #FCA5A5}
  .confirm-modal .modal-head{padding:18px 20px;background:#7F1D1D;border:0}
  .confirm-modal .modal-head h3{color:#fff;font-size:19px}
  .confirm-modal .modal-body{display:block;padding:24px 22px;background:#151F32;color:#E2E8F0;text-align:center}
  .confirm-warning-icon{font-size:38px;line-height:1;margin-bottom:12px}
  .confirm-warning-message{font-size:17px;font-weight:900;line-height:1.7;color:#F8FAFC}
  .confirm-warning-detail{margin:8px 0 0;color:#FCA5A5;font-size:14px;font-weight:700;line-height:1.7}
  .confirm-modal .modal-foot{justify-content:center;padding:14px 18px;background:#151F32;border-color:#334155}
  .confirm-modal .btn-danger{background:#B91C1C;border-color:#DC2626;color:#fff}
  .confirm-modal .btn-danger:hover{background:#991B1B}

  /* ---------- v2 polish ---------- */
  body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#F4F1E9}
  .card{border-radius:14px;border-color:#E7E1D3;box-shadow:0 1px 2px rgba(18,33,63,.05),0 6px 18px rgba(18,33,63,.04)}
  .card h3{font-size:15px;padding-bottom:9px;border-bottom:1px solid #F0EADB;margin-bottom:12px}

<script>
/* ================= STORAGE HELPERS (real local database, with fallback) ================= */
let storageBackend = 'memory'; // 'idb' | 'cloud' | 'local' | 'memory'
let memoryStore = {};
let idbDB = null;
const hasDirectoryAccess = typeof window.showDirectoryPicker === 'function';
const hasFSAccess = hasDirectoryAccess || typeof window.showSaveFilePicker === 'function';
let fsFileHandle = null;
let fsDirectoryHandle = null;
let fsFileName = '';
let fsPermissionStatus = 'prompt';
const DB_FILE_NAME = 'سند صرف المنتجات - البيانات.json';

function openIDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open('moujeh_voucher_db', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function idbGet(key){
  return new Promise((resolve,reject)=>{
    try{
      const tx = idbDB.transaction('kv','readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    }catch(e){ reject(e); }
  });
}
function idbSet(key, value){
  return new Promise((resolve,reject)=>{
    try{
      const tx = idbDB.transaction('kv','readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    }catch(e){ reject(e); }
  });
}

async function probeStorage(){
  try{
    idbDB = await openIDB();
    await idbSet('__probe__','1');
    const v = await idbGet('__probe__');
    if(v==='1'){ storageBackend = 'idb'; await tryRestoreLinkedFile(); return; }
  }catch(e){ /* fall through */ }
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set('__probe__', '1');
      const r = await window.storage.get('__probe__');
      if(r && r.value === '1'){ storageBackend = 'cloud'; return; }
    }
  }catch(e){ /* fall through */ }
  try{
    localStorage.setItem('__probe__','1');
    if(localStorage.getItem('__probe__')==='1'){ storageBackend = 'local'; return; }
  }catch(e){ /* fall through */ }
  storageBackend = 'memory';
}

async function loadKey(key, fallback){
  try{
    if(storageBackend==='idb'){
      const v = await idbGet(key);
      return v!==undefined ? v : fallback;
    }
    if(storageBackend==='cloud'){
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : fallback;
    }
    if(storageBackend==='local'){
      const v = localStorage.getItem(key);
      return v !== null ? JSON.parse(v) : fallback;
    }
    return (key in memoryStore) ? memoryStore[key] : fallback;
  }catch(e){ return fallback; }
}
async function saveKey(key, value){
  try{
    if(storageBackend==='idb'){
      await idbSet(key, value);
    } else if(storageBackend==='cloud'){
      const ok = await window.storage.set(key, JSON.stringify(value));
      if(!ok) throw new Error('cloud save failed');
    } else if(storageBackend==='local'){
      localStorage.setItem(key, JSON.stringify(value));
    } else {
      memoryStore[key] = value;
    }
  }catch(e){
    console.error('storage error', e);
    showToast('⚠️ تعذر الحفظ الدائم — نزّل نسخة احتياطية من "الإعدادات" فورًا');
    return false;
  }
  scheduleLinkedFileSync();
  return storageBackend!=='memory';
}
function storageBadgeInfo(){
  const linked = fsFileHandle ? ` — حفظ تلقائي في ${fsFileName}` : '';
  if(storageBackend==='idb') return {icon:'🟢', text:'قاعدة بيانات محلية حقيقية شغالة على الجهاز ده — بتتحفظ فورًا مع كل تعديل حتى بدون إنترنت'+linked};
  if(storageBackend==='cloud') return {icon:'🟢', text:'الحفظ شغال (سحابي)'+linked};

/* ---- real file-on-disk database link (Chrome/Edge desktop) ---- */
let linkedSyncTimer = null;
function scheduleLinkedFileSync(){
  if(!fsFileHandle || fsPermissionStatus!=='granted') return;
  clearTimeout(linkedSyncTimer);
  linkedSyncTimer = setTimeout(async()=>{
    if(!await writeDbToLinkedFile()) showToast('تعذر الحفظ التلقائي في ملف البيانات');
  },500);
}
function collectFullDbPayload(){
  return {
    exportedAt: new Date().toISOString(),
    clients: DB.clients, vouchers: DB.vouchers, templates: DB.templates,
    drivers: DB.drivers, products: DB.products, companyNames: DB.companyNames,
    settings: DB.settings
  };
}
async function writeDbToLinkedFile(){
  if(!fsFileHandle) return true;
  try{
    let perm = await fsFileHandle.queryPermission({mode:'readwrite'});
    fsPermissionStatus = perm;
    if(perm !== 'granted') return false;
    const writable = await fsFileHandle.createWritable();
    await writable.write(JSON.stringify(collectFullDbPayload(), null, 2));
    await writable.close();
    return true;
  }catch(e){ console.error('linked file write failed', e); return false; }
}
async function tryRestoreLinkedFile(){
  if(!hasFSAccess || !idbDB) return;
  try{
    const directoryHandle = await idbGet('__fsDirectoryHandle__');
    if(directoryHandle){
      fsDirectoryHandle = directoryHandle;
      fsFileHandle = await directoryHandle.getFileHandle(DB_FILE_NAME,{create:true});
      fsFileName = DB_FILE_NAME;
      fsPermissionStatus = await fsFileHandle.queryPermission({mode:'readwrite'});
      return;
    }
    const handle = await idbGet('__fsHandle__');
    if(handle){
      fsFileHandle = handle;
      fsFileName = handle.name||'';
      fsPermissionStatus = await handle.queryPermission({mode:'readwrite'});
    }
  }catch(e){ console.error('linked database restore failed',e); }
}
async function restoreLinkedFilePermission(){
  const handle=fsDirectoryHandle||fsFileHandle;
  if(!handle) return false;
  try{
    fsPermissionStatus=await handle.requestPermission({mode:'readwrite'});
    if(fsPermissionStatus!=='granted'){
      showToast('لم يُسمح بالوصول إلى مجلد الحفظ');
      return false;
    }
    if(fsDirectoryHandle){
      fsFileHandle=await fsDirectoryHandle.getFileHandle(DB_FILE_NAME,{create:true});
      fsFileName=DB_FILE_NAME;
    }
    const file=await fsFileHandle.getFile();
    if(file.size===0 && !await writeDbToLinkedFile()) throw new Error('Unable to initialize database file');
    showToast('تم استعادة الحفظ التلقائي للمجلد المحفوظ');
    return true;
  }catch(e){
    console.error('linked database permission restore failed',e);
    showToast('تعذرت استعادة الوصول إلى ملف البيانات');
    return false;
  }
}
async function linkNewDatabaseFile(){
  if(!hasFSAccess){ showToast('الميزة دي متاحة بس على متصفح كروم/إيدج على الكمبيوتر'); return; }
  try{
    if(hasDirectoryAccess){
      const directoryHandle = await window.showDirectoryPicker({mode:'readwrite'});
      const fileHandle = await directoryHandle.getFileHandle(DB_FILE_NAME,{create:true});
      const file = await fileHandle.getFile();
      let existingData = null;
      if(file.size){
        existingData = JSON.parse(await file.text());
        if(!existingData || typeof existingData!=='object' || Array.isArray(existingData)){
          throw new Error('Invalid database file');
        }
      }
      fsDirectoryHandle = directoryHandle;
      fsFileHandle = fileHandle;
      fsFileName = DB_FILE_NAME;
      fsPermissionStatus='granted';
      await idbSet('__fsDirectoryHandle__',directoryHandle);
      await idbSet('__fsHandle__',fileHandle);
      if(existingData) await applyImportedData(existingData);
      else if(!await writeDbToLinkedFile()) throw new Error('Unable to write database file');
      showToast('تم تفعيل الحفظ التلقائي في المجلد');
      return;
    }
    const handle = await window.showSaveFilePicker({
      suggestedName: DB_FILE_NAME,
      types: [{ description:'ملف قاعدة بيانات', accept:{'application/json':['.json']} }]
    });
    fsFileHandle = handle; fsFileName = handle.name||'';
    fsPermissionStatus='granted';
    await idbSet('__fsHandle__', handle);
    if(!await writeDbToLinkedFile()) throw new Error('Unable to write database file');
    showToast('تم ربط ملف قاعدة البيانات — هيتحدث تلقائيًا مع كل تعديل');
  }catch(e){
    if(e.name!=='AbortError'){
      console.error('database file setup failed',e);
      showToast('تعذر إعداد ملف الحفظ التلقائي');
    }
  }
}
function unlinkDatabaseFile(){
  fsFileHandle = null; fsDirectoryHandle = null; fsFileName='';
  if(idbDB){
    idbSet('__fsHandle__', null).catch(e=>console.error('database unlink failed',e));
    idbSet('__fsDirectoryHandle__', null).catch(e=>console.error('database unlink failed',e));
  }
  showToast('تم إيقاف الحفظ التلقائي للملف');
}

const AR_TO_EN={
'ا':'a','أ':'a','إ':'i','آ':'aa','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'a','ة':'h','ء':'a','ؤ':'w','ئ':'y','لا':'la'
};
const COMMON_NAMES={
'محمد':'Mohammed','أحمد':'Ahmed','احمد':'Ahmed','محمود':'Mahmoud','مصطفى':'Mostafa','مصطفي':'Mostafa',
'عبد':'Abd','العزيز':'Al Aziz','عبدالعزيز':'Abdulaziz','عبد العزيز':'Abdulaziz','جمال':'Gamal','علي':'Ali','على':'Ali',
'حسن':'Hassan','حسين':'Hussein','خالد':'Khaled','سعيد':'Saeed','طارق':'Tariq','ياسر':'Yasser','وليد':'Waleed',
'إبراهيم':'Ibrahim','ابراهيم':'Ibrahim','يوسف':'Youssef','عمر':'Omar','سلمان':'Salman','فهد':'Fahad','ناصر':'Nasser',
'سارة':'Sarah','مريم':'Mariam','نور':'Noor','هاني':'Hany','عادل':'Adel','كريم':'Karim','سامي':'Sami'

function transliterateArabic(text){
  const input=(text||'').trim();
  if(!input) return '';
  return input.split(/(\s+|[-_/.,()]+)/).map(part=>{
    if(!part || /^\s+$/.test(part) || /^[\-_/.,()]+$/.test(part)) return part;
    if(COMMON_NAMES[part]) return COMMON_NAMES[part];
    let out='';
    for(const ch of part) out+=AR_TO_EN[ch]??ch;
    return out;
  }).join('').replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase());
}
/* ===== Text translator ===== */
function isArabicText(text){ return /[\u0600-\u06FF]/.test(text); }
async function requestGoogleTranslation(text){
  const from=isArabicText(text)?'ar':'en',to=from==='ar'?'en':'ar';
  const response=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`);
  if(!response.ok) throw new Error(`Google Translate HTTP ${response.status}`);
  const data=await response.json();
  const translated=Array.isArray(data[0])?data[0].map(part=>part[0]||'').join(''):'';
  if(!translated) throw new Error('Google Translate returned an empty result');
  return {text:translated,source:'google'};
}
async function requestOnlineTranslation(text){
  const from=isArabicText(text)?'ar':'en',to=from==='ar'?'en':'ar';
  const errors=[];
  try{
    return await requestGoogleTranslation(text);
  }catch(error){ errors.push(error); }
  try{
    const response=await fetch(`https://api.mymemory.translated.net/get?langpair=${from}|${to}&q=${encodeURIComponent(text)}`);
    if(!response.ok) throw new Error(`MyMemory HTTP ${response.status}`);
    const data=await response.json();
    const translated=data.responseData&&data.responseData.translatedText;
    if(translated) return {text:translated,source:'online'};
    throw new Error('MyMemory returned an empty result');
  }catch(error){ errors.push(error); }
  throw errors[errors.length-1]||new Error('Online translation services are unavailable');
}
async function requestLiteralTranslation(text){
  const parts=text.split(/(\s+|[.,!?;:()[\]{}"'،؟؛]+)/u);
  const translated=[];
  for(const part of parts){
    if(!part||!part.trim()||!/[A-Za-z\u0600-\u06FF0-9]/.test(part)){
      translated.push(part);
      continue;
    }
    const result=await requestOnlineTranslation(part);
    translated.push(result.text);
  }
  return translated.join('');
}
let translationSequence=0;
let translationDebounceTimer;
async function translateDictionaryText(){
  const input=document.getElementById('dict-translate-input');
  const googleResult=document.getElementById('dict-google-result');
  const literalResult=document.getElementById('dict-literal-result');
  const status=document.getElementById('dict-translation-status');
  if(!input||!googleResult||!literalResult||!status) return;
  const text=input.value.trim();
  if(!text){ status.textContent='اكتب نصًا أولًا.'; return; }
  const sequence=++translationSequence;
  status.textContent='جاري إعداد الترجمتين…';
  const [google,literal]=await Promise.allSettled([
    requestGoogleTranslation(text),
    requestLiteralTranslation(text)
  ]);
  if(sequence!==translationSequence) return;
  const errors=[];
  if(google.status==='fulfilled') googleResult.textContent=google.value.text;
  else{ console.error('تعذرت ترجمة Google للنص:',google.reason); errors.push('تعذرت ترجمة Google'); }
  if(literal.status==='fulfilled') literalResult.textContent=literal.value;
  else{ console.error('تعذرت الترجمة الحرفية للنص:',literal.reason); errors.push('تعذرت الترجمة الحرفية'); }
  status.textContent=errors.length
    ? `${errors.join('، ')}. تحقق من الاتصال بالإنترنت ثم حاول مرة أخرى.`
    : '';
}

function scheduleDictionaryTranslation(){
  clearTimeout(translationDebounceTimer);
  translationSequence++;
  const input=document.getElementById('dict-translate-input');
  const googleResult=document.getElementById('dict-google-result');
  const literalResult=document.getElementById('dict-literal-result');
  const status=document.getElementById('dict-translation-status');
  if(!input||!googleResult||!literalResult||!status) return;
  googleResult.textContent='';
  literalResult.textContent='';
  status.textContent='';
  if(!input.value.trim()) return;
  translationDebounceTimer=setTimeout(()=>translateDictionaryText(),500);
}

function normQ(s){ return (s||'').toLowerCase().replace(/[\u064B-\u065F]/g,'').replace(/[^a-z0-9\u0600-\u06FF ]/g,' ').replace(/\s+/g,' ').trim(); }
function findClientByName(n){ const q=(n||'').trim().toLowerCase(); return q ? (DB.clients.find(c=>(c.company||'').trim().toLowerCase()===q||(c.ar||'').trim()===(n||'').trim())||null) : null; }
function ensureClientCodes(){
  const used=new Set();
  let max=0,changed=false;
  DB.clients.forEach(client=>{
    const code=String(client.code||'').trim();
    if(/^\d+$/.test(code)){
      const number=Number(code);
      if(!used.has(code)){ used.add(code); if(Number.isSafeInteger(number)) max=Math.max(max,number); }
      else{ client.code=''; changed=true; }
    }
  });
  DB.clients.forEach(client=>{
    if(String(client.code||'').trim()) return;
    do{ max++; }while(used.has(String(max)));
    client.code=String(max);
    used.add(client.code);
    changed=true;
  });
  return changed;
}
function nextClientCode(){
  const codes=DB.clients.map(client=>Number(client.code)).filter(code=>Number.isSafeInteger(code)&&code>0);
  return String(Math.max(0,...codes)+1);
}
function renumberClientCodes(){
  if(DB.settings.clientCodesSequentialV3) return false;
  const codeMap=new Map();
  const sorted=[...DB.clients].sort((a,b)=>
    Number(!isGulfSectorsClient(a))-Number(!isGulfSectorsClient(b)) ||
    (a.company||'').localeCompare(b.company||'') ||
    (a.ar||'').localeCompare(b.ar||'') ||
    String(a.id).localeCompare(String(b.id))
  );
  sorted.forEach((client,index)=>{
    const oldCode=String(client.code||'').trim();
    if(oldCode&&!codeMap.has(oldCode)) codeMap.set(oldCode,String(index+1));
    client.code=String(index+1);
  });
  DB.vouchers.forEach(voucher=>{
    const oldCode=String(voucher.clientCode||'').trim();
    if(codeMap.has(oldCode)) voucher.clientCode=codeMap.get(oldCode);
  });
  DB.settings.clientCodesSequentialV3=true;
  return true;
}
function isGulfSectorsClient(client){
  const name=`${client.ar||''} ${client.company||''}`.toLowerCase();
  return name.includes('قطاعات الخليج') || /qitaeat\s+al[- ]?khalij/.test(name);
}
function searchClients(q){
  q=normQ(q); if(!q) return [];
  return DB.clients.map(c=>{
    const n=normQ(c.company+' '+(c.ar||'')), nn=n.replace(/^al /,'');
    const code=String(c.code||'').trim();
    let s=0;
    if(/^\d+$/.test(q)&&code.startsWith(q)) s=code===q?10:5;
    else if(n.startsWith(q)) s=4; else if(nn.startsWith(q)) s=3; else if(n.split(' ').some(w=>w.startsWith(q))) s=2; else if(n.includes(q)) s=1;
    return {c,s};
  }).filter(x=>x.s).sort((a,b)=>b.s-a.s||(a.c.company||'').localeCompare(b.c.company||'')).map(x=>x.c);
}

function showClientCodePreview() {
  const clientInput = document.getElementById('v-client');
  const clientCodePreview = document.getElementById('client-code-preview');
  const clientCodeValue = document.getElementById('client-code-value');
  
  if (!clientInput || !clientCodePreview || !clientCodeValue) return;
  
  const clientName = clientInput.value.trim();
  
  if (clientName.length >= 1) {
    // البحث عن العميل الذي يبدأ بنفس الحرف الأول
    const matchingClients = DB.clients.filter(c => {
      const clientFullName = `${c.ar || ''} ${c.company || ''} `;
      return clientFullName.toLowerCase().startsWith(clientName.toLowerCase());
    });
    
    if (matchingClients.length > 0) {
      clientCodePreview.style.display = 'flex';
      // إذا كان هناك تطابق واحد فقط، أظهر الكود
      if (matchingClients.length === 1) {
        const client = matchingClients[0];
        clientCodeValue.textContent = client.code || '--';
      } else {
        // إذا كان هناك أكثر من تطابق، أظهر العدد فقط
        clientCodeValue.textContent = `${matchingClients.length} تطابق`;
      }
    } else {

    }
  } else {
    clientCodePreview.style.display = 'none';
  }

function updateNumericInputDisplay(input){
  const display=input.closest('.numeric-input-shell')?.querySelector('.numeric-input-display');
  if(!display) return;
  const value=input.value||input.placeholder;
  display.replaceChildren();
  display.classList.toggle('is-placeholder',!input.value);
  value.split(/(\d+)/).forEach(part=>{
    if(!part) return;
    if(/^\d+$/.test(part)){
      const number=document.createElement('span');
      number.className='numeric-input-number';
      number.textContent=part;
      display.appendChild(number);
    }else{
      display.appendChild(document.createTextNode(part));
    }
  });
}

function collectVoucherFromDom(){
  const v = voucherDraft;
  v.number = document.getElementById('v-number').value.trim();
  v.date = document.getElementById('v-date').value;
  v.clientName = document.getElementById('v-client').value.trim();
  const client = findClientByName(v.clientName);
  v.clientId = client ? client.id : '';
  v.templateId = document.getElementById('v-tpl')?.value || v.templateId || '';
  v.extra = v.extra||{}; document.querySelectorAll('.ex-in').forEach(i=>{ v.extra[i.dataset.k]=i.value; });
  v.items = [...document.querySelectorAll('.item-row')].map((row)=>{
    const i = row.dataset.itemIdx;
    return {
      item: row.querySelector('.it-item').value,
      qty: row.querySelector('.it-qty').value,
      drum: row.querySelector('.it-drum').value
    };
  });
  v.receiver = {
    name: document.getElementById('r-name').value,

    iqama: document.getElementById('r-iqama').value,
    car: document.getElementById('r-car').value,
    route: document.getElementById('r-route').value

}

async function saveVoucher(v){
  const idx = DB.vouchers.findIndex(x=>x.id===v.id);
  if(idx>=0) DB.vouchers[idx] = v; else DB.vouchers.push(v);
  const numVal = parseInt(v.number,10);
  const nextNumber=Math.max(getNextVoucherNumber(),!isNaN(numVal)?numVal+1:1);
  if(nextNumber!==DB.settings.nextNumber){
    DB.settings.nextNumber = nextNumber;
    await saveKey('moujeh:settings', DB.settings);
  }
  await saveKey('moujeh:vouchers', DB.vouchers);
  await upsertDriver(v.receiver);
  for(const it of (v.items||[])){
    if((it.item||'').trim()) await upsertProduct(it.item, it.qty||'', it.drum||'', true);
  }
  await ensureClient(v.clientName);
  await saveKey('moujeh:activeDraft', null);
}

/* driver / receiver mini-database, keyed by name */
async function upsertDriver(receiver, persist){
  if(persist===undefined) persist = true;
  const name = (receiver?.name||'').trim();
  if(!name) return;
  const idx = DB.drivers.findIndex(d=>d.name.trim().toLowerCase()===name.toLowerCase());
  const rec = {
    name,
    nationality: receiver.nationality||'',
    mobile: receiver.mobile||'',
    iqama: receiver.iqama||'',
    car: receiver.car||'',
    route: receiver.route||''
  };
  if(idx>=0) DB.drivers[idx] = {...DB.drivers[idx], ...rec}; else DB.drivers.push(rec);
  if(persist) await saveKey('moujeh:drivers', DB.drivers);
}
function findDriver(name){
  const n = (name||'').trim().toLowerCase();
  if(!n) return null;
  return DB.drivers.find(d=>d.name.trim().toLowerCase()===n) || null;
}
function getDriverNameSuggestions(){
  const isPreferredDriver=name=>(name||'').trim().replace(/[إأآ]/g,'ا')==='محمد اسماعيل';
  return [...DB.drivers].sort((a,b)=>Number(isPreferredDriver(b.name))-Number(isPreferredDriver(a.name)));
}

/* products mini-database */
async function upsertProduct(item, qty, drum, persist){
  if(persist===undefined) persist = true;
  const name = (item||'').trim();
  if(!name) return;
  const idx = DB.products.findIndex(p=>p.item.trim().toLowerCase()===name.toLowerCase() && (p.qty||'')===(qty||''));
  const rec = { item:name, qty:qty||'', drum:drum||'' };
  if(idx>=0) DB.products[idx] = rec; else DB.products.push(rec);
  if(persist) await saveKey('moujeh:products', DB.products);
}
function findProduct(item){
  const n = (item||'').trim().toLowerCase();
  if(!n) return null;
  return DB.products.find(p=>p.item.trim().toLowerCase()===n) || null;
}

/* company-name reference list (separate from full client records) */
function upsertCompanyName(name, persist){
  if(persist===undefined) persist = true;
  const n = (name||'').trim();
  if(!n) return;
  if(!DB.companyNames.some(c=>c.toLowerCase()===n.toLowerCase())){
    DB.companyNames.push(n);
    if(persist) saveKey('moujeh:companyNames', DB.companyNames);
  }
}

  const names=Object.keys(clientStats).sort((a,b)=>clientStats[b].vouchers-clientStats[a].vouchers||a.localeCompare(b,'ar'));

      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:i%2?BAND_B:BAND_A}};
      c.border=border;
      c.alignment={horizontal:j===1?'right':'center',vertical:'middle',readingOrder:'rtl'};
    });
    row.height=21;
  });
  const tr=names.length+3, tRow=ws2.getRow(tr);
  tRow.getCell(2).value='الإجمالي';
  tRow.getCell(3).value={formula:`SUM(C3:C${tr-1})`};
  tRow.getCell(4).value={formula:`SUM(D3:D${tr-1})`};
  for(let j=1;j<=4;j++){

    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};

async function exportBackup(){
  const blob = new Blob([JSON.stringify(collectFullDbPayload(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `moujeh-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

async function applyImportedData(data){
  if(!data || typeof data !== 'object') throw new Error('invalid file');
  DB.clients = data.clients || [];
  DB.vouchers = data.vouchers || [];
  DB.templates = data.templates && data.templates.length ? data.templates : DB.templates;
  DB.drivers = data.drivers || [];
  DB.products = data.products || [];
  DB.companyNames = data.companyNames || [];
  DB.settings = {...DB.settings, ...(data.settings||{})};
  DB.settings.migV2=false; migrateV2(); applyFixedPosAll();
  ensureClientCodes();
  renumberClientCodes();
  await saveKey('moujeh:clients', DB.clients);
  await saveKey('moujeh:vouchers', DB.vouchers);
  await saveKey('moujeh:templates', DB.templates);
  await saveKey('moujeh:drivers', DB.drivers);
  await saveKey('moujeh:products', DB.products);
  await saveKey('moujeh:companyNames', DB.companyNames);
  await saveKey('moujeh:settings', DB.settings);
  navigate('dashboard');
}
async function importBackup(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    await applyImportedData(data);
    showToast('تم استرجاع النسخة الاحتياطية بنجاح');
  }catch(e){
    console.error(e);
    showToast('الملف مش صالح — تأكد إنه نسخة احتياطية صحيحة');
  }
}

function buildCalFieldEl(key, cfg, sampleText){
  const div = document.createElement('div');
  div.className = 'cal-field';
  div.dataset.key = key;
  div.dataset.anchor = cfg.anchor==='right' ? 'right' : 'left';
  if(cfg.anchor==='right') div.style.right = cfg.x+'mm';
  else div.style.left = cfg.x+'mm';
  div.style.top = cfg.y+'mm';
  div.style.fontSize = cfg.size+'pt';
  div.style.direction = cfg.dir==='auto' ? 'rtl' : cfg.dir;
  div.style.textAlign = cfg.align;
  div.innerHTML = `<span class="tag">${FIELD_LABELS[key]||activeTemplate().fields[key]?.label||key}</span>${sampleText}`;
  return div;
}

  div.className = 'cal-field';
  div.dataset.key = key;
  div.style.left = x+'mm'; div.style.top = y+'mm';
  div.style.fontSize = size+'pt'; div.style.direction = dir; div.style.textAlign = align;
  div.innerHTML = `<span class="tag">${label}</span>${text}`;
  return div;
}

function attachDrag(){
  const page = document.getElementById('cal-page');
  if(!page) return;
  let dragging = null, startX=0, startY=0, origX=0, origY=0;
  const pxPerMm = 3.7795;

  page.querySelectorAll('.cal-field').forEach(el=>{
    el.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      dragging = el;
      el.classList.add('active');
      startX = e.clientX; startY = e.clientY;
      origX = parseFloat(el.dataset.anchor==='right' ? el.style.right : el.style.left);
      origY = parseFloat(el.style.top);
      selectFieldPanel(el.dataset.key);
    });
    el.addEventListener('touchstart', (e)=>{
      const touch = e.touches[0];
      dragging = el; el.classList.add('active');
      startX = touch.clientX; startY = touch.clientY;
      origX = parseFloat(el.dataset.anchor==='right' ? el.style.right : el.style.left);
      origY = parseFloat(el.style.top);
      selectFieldPanel(el.dataset.key);
    }, {passive:true});
  });
  function move(clientX, clientY){
    if(!dragging) return;
    const dx = (clientX-startX)/(pxPerMm*calScale);
    const dy = (clientY-startY)/(pxPerMm*calScale);
    const isRight = dragging.dataset.anchor==='right';
    let nx = Math.max(0, isRight ? (origX - dx) : (origX + dx));
    let ny = Math.max(0, origY+dy);
    applyFieldPositionUpdate(dragging.dataset.key, nx, ny);
  }
  document.onmousemove = (e)=> move(e.clientX, e.clientY);
  document.ontouchmove = (e)=>{ if(dragging){ const t=e.touches[0]; move(t.clientX,t.clientY);} };
  document.onmouseup = ()=>{ if(dragging){ dragging.classList.remove('active'); dragging=null; renderCalPanel(); } };
  document.ontouchend = ()=>{ if(dragging){ dragging.classList.remove('active'); dragging=null; renderCalPanel(); } };
}

function applyFieldPositionUpdate(key, x, y){
  const t = activeTemplate();
  x = Math.round(x*10)/10; y = Math.round(y*10)/10;
  if(key==='table_anchor'){
    t.table_temp_x = x;
    t.fields.table.startY = y+5;
  } else if(key.startsWith('t_item_')){
    t.fields.table.colItemX = x;
  } else if(key.startsWith('t_qty_')){
    t.fields.table.colQtyX = x;
  } else {
    t.fields[key].x = x; t.fields[key].y = y;
  }
  applyFixedPosAll(); renderCalPage();
  saveKey('moujeh:templates', DB.templates);
}

let selectedFieldKey = 'date';
function selectFieldPanel(key){

function persistAndRedraw(){ applyFixedPosAll(); renderCalPage(); saveKey('moujeh:templates', DB.templates); }

/* ================= PRINTING ================= */
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d && m && y ? `${d}/${m}/${y}` : iso;
}

function buildPrintPage(v, t){
  const f = {...t.fields}; for(const k in FIXED_POS) if(f[k]) f[k]={...f[k],...FIXED_POS[k]};
  const client = DB.clients.find(c=>c.code===v.clientCode);
  const pieces = [];
  const pf = (cfg, text)=> {
    if(!text) return '';
    const side = cfg.anchor==='right' ? 'right' : 'left';
    return `<div class="pf" style="${side}:${cfg.x}mm;top:${cfg.y}mm;font-size:${cfg.size}pt;font-weight:700;
      direction:${cfg.dir==='auto'?'rtl':cfg.dir};text-align:${cfg.align};font-family:'Times New Roman', Times, serif;">${escapeHtml(text)}</div>`;
  };

  if(f.number.visible) pieces.push(pf(f.number, String(v.number||'')));
  if(f.date.visible) pieces.push(pf(f.date, fmtDate(v.date)));
  if(f.payTo.visible) pieces.push(pf(f.payTo, v.clientName || client?.company || ''));

  const tb = f.table;
  (tb.visible===false?[]:(v.items||[])).slice(0, tb.maxRows).forEach((it,i)=>{
    const y = tb.startY + i*tb.rowHeight;
    const itemText = [it.item, it.qty].filter(Boolean).join('  ');
    if(itemText) pieces.push(pf({x:tb.colItemX,y,size:tb.size,align:'right',dir:'ltr'}, itemText));
    if(it.drum) pieces.push(pf({x:tb.colQtyX,y,size:tb.size,align:'right',dir:'ltr'}, it.drum));
  });

  const r = v.receiver||{};
  if(f.r_name.visible) pieces.push(pf(f.r_name, r.name));
  if(f.r_nationality.visible) pieces.push(pf(f.r_nationality, r.nationality));
  if(f.r_mobile.visible) pieces.push(pf(f.r_mobile, r.mobile));
  if(f.r_iqama.visible) pieces.push(pf(f.r_iqama, r.iqama));
  if(f.r_car.visible) pieces.push(pf(f.r_car, r.car));
  if(f.r_route.visible) pieces.push(pf(f.r_route, r.route));
  Object.keys(f).forEach(k=>{ const c=f[k]; if(c&&c.custom&&c.visible) pieces.push(pf(c, c.text||(v.extra||{})[k]||'')); });

  return `<div class="print-page">${pieces.join('')}</div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let pendingPrintHtml = '';
function openPrintPreview(printPageHtml){
  pendingPrintHtml = printPageHtml;
  document.getElementById('print-preview-frame').innerHTML =
    printPageHtml.replace('class="print-page"', 'class="print-page preview-mode"');
  document.getElementById('print-modal').classList.add('open');
}
function closePrintPreview(){
  document.getElementById('print-modal').classList.remove('open');
}

function printVoucher(v){
  const t = tplFor(v);
  openPrintPreview(buildPrintPage(v, t));
}

function printTestGrid(){
  let lines = '';
  for(let x=0;x<=210;x+=10) lines += `<div class="pf" style="left:${x}mm;top:2mm;font-size:6pt;">${x}</div>`;
  for(let y=0;y<=290;y+=10) lines += `<div class="pf" style="left:2mm;top:${y}mm;font-size:6pt;">${y}</div>`;
  openPrintPreview(`<div class="print-page" style="background-image:repeating-linear-gradient(0deg,#000 0 0.3mm,transparent 0.3mm 10mm),repeating-linear-gradient(90deg,#000 0 0.3mm,transparent 0.3mm 10mm);">${lines}</div>`);
}

    render();
    return;
  }
  if(e.target.id==='btn-save-new-voucher'){
    const button=e.target;
    button.disabled=true;
    try{
      const v=collectVoucherFromDom();
      if(!v.clientName){ showToast('اكتب اسم العميل الأول'); return; }
      if(!v.number){ showToast('لازم رقم للسند'); return; }
      clearTimeout(draftSaveTimer);
      await saveVoucher(v);
      editingVoucherId=null;
      voucherDraft=freshVoucherDraft();
      await saveKey('moujeh:activeDraft',voucherDraft);
      showToast('تم حفظ السند وبدء سند جديد');
      navigate('newVoucher');
    } finally {
      button.disabled=false;
    }
    return;
  }
  if(e.target.closest('[data-del-item]')){
    collectVoucherFromDom();
    const i = parseInt(e.target.closest('[data-del-item]').dataset.delItem,10);
    voucherDraft.items.splice(i,1);
    if(voucherDraft.items.length===0) voucherDraft.items.push(nextEmptyItem());
    render();
    return;
  }
  if(e.target.id==='btn-cancel-voucher'){ await clearVoucherDraft(); editingVoucherId=null; navigate('history'); return; }
  if(e.target.id==='btn-save-voucher' || e.target.id==='btn-save-print'){
    const v = collectVoucherFromDom();
    if(!v.clientName){ showToast('اكتب اسم العميل الأول'); return; }
    if(!v.number){ showToast('لازم رقم للسند'); return; }
    await saveVoucher(v);
    showToast('تم حفظ السند');
    const wasPrint = e.target.id==='btn-save-print';
    await clearVoucherDraft(); editingVoucherId=null;
    if(wasPrint){ printVoucher(v); navigate('history'); }
    else navigate('history');
    return;
  }
  if(e.target.closest('[data-open-voucher]')){
    editingVoucherId = e.target.closest('[data-open-voucher]').dataset.openVoucher;
    voucherDraft = null;
    navigate('newVoucher');
    return;
  }
  if(e.target.closest('[data-print-voucher]')){
    const id = e.target.closest('[data-print-voucher]').dataset.printVoucher;
    const v = DB.vouchers.find(x=>x.id===id);
    if(v) printVoucher(v);
    return;
  }
  if(e.target.closest('[data-del-voucher]')){
    const id = e.target.closest('[data-del-voucher]').dataset.delVoucher;
    if(confirm('تأكيد حذف هذا السند؟')){
      DB.vouchers = DB.vouchers.filter(v=>v.id!==id);
      await saveKey('moujeh:vouchers', DB.vouchers);
      renderHistoryList(document.getElementById('hist-search')?.value||'');
      showToast('تم الحذف');
    }
    return;
  }

  if(e.target.id==='btn-save-settings'){
    DB.settings.nextNumber = parseInt(document.getElementById('s-next-number').value,10)||DB.settings.nextNumber;
    await saveKey('moujeh:settings', DB.settings);
    showToast('تم الحفظ');
    return;
  }
  if(e.target.id==='btn-export-backup'){ await exportBackup(); DB.settings.lastBackup=Date.now(); await saveKey('moujeh:settings', DB.settings); showToast('تم تنزيل النسخة الاحتياطية'); return; }
  if(e.target.id==='btn-restore-db-file'){ await restoreLinkedFilePermission(); navigate('settings'); return; }
  if(e.target.id==='btn-link-db-file'){ await linkNewDatabaseFile(); navigate('settings'); return; }
  if(e.target.id==='btn-unlink-db-file'){ unlinkDatabaseFile(); navigate('settings'); return; }
  if(e.target.id==='btn-save-active-template'){
    DB.settings.activeTemplateId = document.getElementById('s-active-template').value;
    await saveKey('moujeh:settings', DB.settings);
    showToast('تم تفعيل النموذج');
    return;
  }
  if(e.target.id==='btn-new-template'){
    const name = prompt('اسم النموذج الجديد:', 'نموذج جديد');
    if(name){
      const t = newTemplate(name);
      if(confirm('تبدأ بنموذج فاضي (موافق) وتضيف حقولك بنفسك؟\nولا نسخة من الحقول الافتراضية (إلغاء)؟')){
        Object.keys(t.fields).forEach(k=>{ if(k!=='table') t.fields[k].visible = (k==='date'); });
        t.fields.table.visible = false;
      }
      DB.templates.push(t);
      DB.settings.activeTemplateId = t.id;
      await saveKey('moujeh:templates', DB.templates);
      await saveKey('moujeh:settings', DB.settings);
      navigate('calibrate');
    }
    return;
  }
  if(e.target.id==='btn-rename-template'){
    const t = activeTemplate();
    const name = prompt('الاسم الجديد:', t.name);
    if(name){ t.name = name; await saveKey('moujeh:templates', DB.templates); navigate('calibrate'); }
    return;
  }
  if(e.target.id==='btn-delete-template'){
    if(DB.templates.length<=1){ showToast('لازم يفضل نموذج واحد على الأقل'); return; }
    requestTemplateAction('delete');
    return;
  }
  if(e.target.id==='btn-zoom-in'){ calScale=Math.min(1.1, calScale+0.08); document.getElementById('cal-page').style.transform=`scale(${calScale})`; return; }
  if(e.target.id==='btn-zoom-out'){ calScale=Math.max(0.3, calScale-0.08); document.getElementById('cal-page').style.transform=`scale(${calScale})`; return; }
  if(e.target.id==='btn-test-print'){ printTestGrid(); return; }
  if(e.target.id==='btn-reset-template'){
    requestTemplateAction('reset');
    return;
  }

  /* ---- reference lists ---- */
  if(e.target.id==='btn-add-products'){
    const lines = document.getElementById('bulk-products').value.split('\n').map(l=>l.trim()).filter(Boolean);
    lines.forEach(line=>{
      const [item,qty,drum] = line.split('|').map(s=>s?.trim()||'');
      if(item) upsertProduct(item, qty, drum);
    });
    renderProductsList();
    document.getElementById('bulk-products').value='';
    showToast(`تم إضافة ${lines.length} صنف`);
    return;
  }
  if(e.target.closest('[data-del-product]')){
    const i = parseInt(e.target.closest('[data-del-product]').dataset.delProduct,10);
    DB.products.splice(i,1);
    if(editingProductIndex===i) editingProductIndex=null;
    else if(editingProductIndex!==null&&editingProductIndex>i) editingProductIndex--;
    await saveKey('moujeh:products', DB.products);
    renderProductsList();
    return;
  }
  if(e.target.closest('[data-edit-product]')){
    editingProductIndex=parseInt(e.target.closest('[data-edit-product]').dataset.editProduct,10);
    renderProductsList();
    return;
  }
  if(e.target.closest('[data-cancel-product-edit]')){
    editingProductIndex=null;
    renderProductsList();
    return;
  }
  if(e.target.closest('[data-save-product]')){
    const index=parseInt(e.target.closest('[data-save-product]').dataset.saveProduct,10);
    const existing=DB.products[index];
    if(!existing) throw new Error('الصنف المراد تعديله غير موجود');
    const row=e.target.closest('tr');
    const value=field=>row.querySelector(`[data-product-field="${field}"]`).value.trim();
    const item=value('item');
    if(!item){ showToast('اكتب اسم الصنف'); return; }
    DB.products[index]={...existing,item,qty:value('qty'),drum:value('drum')};
    const saved=await saveKey('moujeh:products',DB.products);
    clearTimeout(linkedSyncTimer);
    const linkedSaved=fsFileHandle?await writeDbToLinkedFile():false;
    if(!saved&&!linkedSaved){
      showToast('⚠️ تعذّر الحفظ الدائم؛ اربطي ملف قاعدة بيانات من الإعدادات قبل إغلاق البرنامج');
      return;
    }
    if(fsFileHandle&&!linkedSaved){
      showToast('⚠️ حُفظ التعديل في المتصفح، لكن تعذّر تحديث ملف قاعدة البيانات المرتبط');
      return;
    }
    editingProductIndex=null;
    renderProductsList();
    showToast('تم تعديل بيانات الصنف');
    return;
  }
  if(e.target.id==='btn-add-drivers'){
    const lines = document.getElementById('bulk-drivers').value.split('\n').map(l=>l.trim()).filter(Boolean);
    for(const line of lines){
      const [name,nationality,mobile,iqama,car] = line.split('|').map(s=>s?.trim()||'');
      if(name) await upsertDriver({name,nationality,mobile,iqama,car,route:''});
    }
    renderDriversList();
    document.getElementById('bulk-drivers').value='';
    showToast(`تم إضافة ${lines.length} سائق`);
    return;
  }
  if(e.target.closest('[data-edit-driver]')){
    editingDriverIndex=parseInt(e.target.closest('[data-edit-driver]').dataset.editDriver,10);
    renderDriversList();
    return;
  }
  if(e.target.closest('[data-cancel-driver-edit]')){
    editingDriverIndex=null;
    renderDriversList();
    return;
  }
  if(e.target.closest('[data-save-driver]')){
    const index=parseInt(e.target.closest('[data-save-driver]').dataset.saveDriver,10);
    const existing=DB.drivers[index];
    if(!existing) throw new Error('السائق المراد تعديله غير موجود');
    const row=e.target.closest('tr');
    const value=field=>row.querySelector(`[data-driver-field="${field}"]`).value.trim();
    const name=value('name');
    if(!name){ showToast('اكتب اسم السائق'); return; }
    DB.drivers[index]={...existing,name,nationality:value('nationality'),mobile:value('mobile'),iqama:value('iqama'),car:value('car'),route:value('route')};
    await saveKey('moujeh:drivers', DB.drivers);
    editingDriverIndex=null;
    renderDriversList();
    showToast('تم تعديل بيانات السائق');
    return;
  }
  if(e.target.closest('[data-del-driver]')){
    const i = parseInt(e.target.closest('[data-del-driver]').dataset.delDriver,10);
    DB.drivers.splice(i,1);
    if(editingDriverIndex===i) editingDriverIndex=null;
    else if(editingDriverIndex!==null&&editingDriverIndex>i) editingDriverIndex--;
    await saveKey('moujeh:drivers', DB.drivers);
    renderDriversList();
    return;
  }
  if(e.target.id==='btn-add-companies'){
    const lines = document.getElementById('bulk-companies').value.split('\n').map(l=>l.trim()).filter(Boolean);
    lines.forEach(n=>upsertCompanyName(n));
    renderCompaniesList();
    document.getElementById('bulk-companies').value='';
    showToast(`تم إضافة ${lines.length} اسم شركة`);
    return;
  }
  if(e.target.closest('[data-del-company]')){
    const i = parseInt(e.target.closest('[data-del-company]').dataset.delCompany,10);
    DB.companyNames.splice(i,1);
    await saveKey('moujeh:companyNames', DB.companyNames);
    renderCompaniesList();
    return;
  }
  if(e.target.closest('[data-promote-company]')){
    const i = parseInt(e.target.closest('[data-promote-company]').dataset.promoteCompany,10);
    const name = DB.companyNames[i];
    editingClientCode = null;
    navigate('clientForm');
    setTimeout(()=>{ const inp=document.getElementById('f-company'); if(inp) inp.value=name; }, 0);
    return;
  }
});

document.body.addEventListener('input', (e)=>{
  if(e.target.matches?.('.it-item, .it-qty, .it-drum')) updateNumericInputDisplay(e.target);
  if(e.target.id==='dict-translate-input'){ scheduleDictionaryTranslation(); }
  if(e.target.id==='v-client'){
    showSuggest();
  }
  if(e.target.id==='v-number' || e.target.id==='v-date' || e.target.id==='v-client' ||
     e.target.id==='r-name' || e.target.id==='r-nationality' || e.target.id==='r-mobile' ||
     e.target.id==='r-iqama' || e.target.id==='r-car' || e.target.id==='r-route' ||
     e.target.classList?.contains('it-item') || e.target.classList?.contains('it-qty') ||
     e.target.classList?.contains('it-drum') || e.target.classList?.contains('ex-in')){
    saveVoucherDraftSoon();
  }
  if(e.target.id==='client-search'){ renderClientList(e.target.value); }
  if(e.target.id==='hist-search'){ renderHistoryList(e.target.value); }
  if(e.target.id==='exp-from'||e.target.id==='exp-to'){ updateExportCount(); }
  if(e.target.id==='r-name'){
    const d = findDriver(e.target.value);
    if(d){
      document.getElementById('r-nationality').value = d.nationality||'';
      document.getElementById('r-mobile').value = d.mobile||'';
      document.getElementById('r-iqama').value = d.iqama||'';
      document.getElementById('r-car').value = d.car||'';
      document.getElementById('r-route').value = d.route||'';
      showToast('تم جلب بيانات المستلم المحفوظة');
    }
  }
  if(e.target.classList?.contains('it-item')){
    const p = findProduct(e.target.value);
    if(p){
      const row = e.target.closest('.item-row');
      const qtyInput=row.querySelector('.it-qty');
      const drumInput=row.querySelector('.it-drum');
      qtyInput.value = p.qty||'';
      drumInput.value = p.drum||'';
      updateNumericInputDisplay(qtyInput);
      updateNumericInputDisplay(drumInput);
      showToast('تم جلب بيانات الصنف المحفوظة');
    }
  }
  if(e.target.classList?.contains('it-item') || e.target.classList?.contains('it-qty') || e.target.classList?.contains('it-drum')){
    const row=null;
    if(row){
      const item=row.querySelector('.it-item')?.value?.trim();
      const qty=row.querySelector('.it-qty')?.value?.trim()||'';
      const drum=row.querySelector('.it-drum')?.value?.trim()||'';
      if(item) upsertProduct(item,qty,drum,true);
    }
  }
});
document.body.addEventListener('change', (e)=>{
  if(e.target.id==='v-tpl'){ collectVoucherFromDom(); render(); return; }
  if(e.target.id==='cal-template-select'){
    DB.settings.activeTemplateId = e.target.value;
    saveKey('moujeh:settings', DB.settings);
    renderCalPage(); renderCalPanel();
  }
  if(e.target.id==='btn-import-backup'){
    const file = e.target.files[0];
    if(file) importBackup(file);
  }
});

/* ================= AFTER RENDER HOOK ================= */
function afterRender(){
  document.querySelectorAll('.numeric-input-shell input').forEach(updateNumericInputDisplay);
  if(currentView==='newVoucher') updateLivePreview();
  if(currentView==='clients') renderClientList();
  if(currentView==='history'){ renderHistoryList(); updateExportCount(); }
  if(currentView==='calibrate'){ renderCalPage(); renderCalPanel(); }
  if(currentView==='refs'){ renderProductsList(); renderDriversList(); renderCompaniesList(); }
}

/* ================= EXTRA SAFETY ================= */
window.addEventListener('beforeunload', ()=>{
  try{
    if(voucherDraft) {
      collectVoucherFromDom();
      localStorage.setItem('moujeh:emergencyDraft', JSON.stringify(voucherDraft));
    }
  }catch(e){}
});
function colorizeVisibleNumbers(root){
  if(!root) return;
  const excluded='.numeric-text,.cal-page,.print-page,#print-root,script,style,textarea';
  const textNodes=[];
  if(root.nodeType===Node.TEXT_NODE){
    const parent=root.parentElement;
    if(parent&&/\d/.test(root.nodeValue)&&!parent.closest(excluded)) textNodes.push(root);
  } else if(root.nodeType===Node.ELEMENT_NODE&&!root.matches(excluded)&&!root.closest(excluded)){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
      acceptNode(node){
        const parent=node.parentElement;
        if(!parent||!/\d/.test(node.nodeValue)||parent.closest(excluded)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    while(walker.nextNode()) textNodes.push(walker.currentNode);
  }
  textNodes.forEach(node=>{
    const parts=node.nodeValue.split(/(\d+(?:[.,:/-]\d+)*)/g);
    if(parts.length<2) return;
    const fragment=document.createDocumentFragment();
    parts.forEach((part,index)=>{
      if(index%2) {
        const span=document.createElement('span');
        span.className='numeric-text';
        span.textContent=part;
        fragment.appendChild(span);
      } else if(part) fragment.appendChild(document.createTextNode(part));
    });
    node.replaceWith(fragment);
  });
}
const visibleNumberObserver=new MutationObserver(records=>{
  records.forEach(record=>record.addedNodes.forEach(colorizeVisibleNumbers));
});
visibleNumberObserver.observe(document.getElementById('view'),{childList:true,subtree:true});
/* ================= INIT ================= */
(async function init(){
  await probeStorage();
  await loadAll();
  setActiveTab();
  render();
})();
